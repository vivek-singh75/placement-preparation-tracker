<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>
    <link rel="stylesheet" href="../css/createAcc.css">
    
</head>
<body>

    <section class="container">

        <div class="signup-box">
            <h2>Create Account</h2>

            <form>

                <div class="input-box">
                    <label>Full Name</label>
                    <input type="text" id="name" placeholder="Enter your name">
                </div>

                <div class="input-box">
                    <label>Email</label>
                    <input type="email" id="email" placeholder="Enter your email">
                </div>

                <div class="input-box">
                    <label>UserName</label>
                    <input type="text" id="username" placeholder="Create Username">
                    <small class="error" id="usernameError"></small>
                </div>

                <div class="input-box">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="Create Password">
                    <small class="error" id="passwordError"></small>
                </div>

                <div class="input-box">
                    <label>Confirm Password</label>
                    <input type="password" id="confirmPassword" placeholder="Confirm Password">
                    <small class="error" id="passwordError"></small>
                </div>

                <button type="submit">Create Account</button>

                <p>
                    Already have an account?
                    <a href="../index.html">Login</a>
                </p>

            </form>
        </div>

    </section>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <!-- Your JS SECOND -->
     <script src="./js/register.js"></script>
    <script>
        const nameInput = document.querySelector("#name");
        const emailInput = document.querySelector("#email");
        const usernameInput = document.querySelector("#username");
        const passwordInput = document.querySelector("#password");
        const confirmPasswordInput = document.querySelector("#confirmPassword");
        const form = document.querySelector("form");

        form.addEventListener("submit", async function (dets) {
            dets.preventDefault();

            document.querySelector("#usernameError").textContent = "";
            document.querySelector("#passwordError").textContent = "";

            const usernameRegex = /^[a-zA-Z0-9_]{5,15}$/;

            const passwordRegex =
                /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$/;

            const name = nameInput.value;
            const email = emailInput.value;
            const username = usernameInput.value;
            const password = passwordInput.value;
            const confirmPassword = confirmPasswordInput.value;

            const usernameValid = usernameRegex.test(username);
            const passwordValid = passwordRegex.test(password);

            if (!usernameValid) {
                document.querySelector("#usernameError").textContent =
                    "Username is wrong";
                return;
            }

            if (!passwordValid) {
                document.querySelector("#passwordError").textContent =
                    "Password is wrong";
                return;
            }

            if (password !== confirmPassword) {
                document.querySelector("#passwordError").textContent =
                    "Passwords do not match";
                return;
            }

            const userData = {
                name,
                email,
                username,
                password,
                confirmPassword
            };
            try {
                const response = await axios.post(
                    "https://placement-preparation-tracker-ltlg.onrender.com/api/user/users",
                    userData
                );

                console.log("Data sent to backend");
                alert("Account Created Successfully")
                console.log(response.data);
                console.log(response.data.message);
            } catch (error) {
                console.log("Error while post:", error);

                console.log(
                    error.response?.data?.message || error.message
                );
            }
        });
    </script>
</body>
</html>
