<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Page</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
    background-color: #fff;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background: rgb(7, 23, 32);;
}

.login-container{
    width:350px;
    padding:30px;
    background:white;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.2);
}

.login-container h2{
    text-align:center;
    margin-bottom:20px;
}

.input-group{
    margin-bottom:15px;
}

.input-group label{
    display:block;
    margin-bottom:5px;
    font-weight:bold;
}

.input-group input{
    width:100%;
    padding:10px;
    border:1px solid #ccc;
    border-radius:5px;
}

button,a{
    width:100%;
    padding:10px;
    border:none;
    background:#007bff;
    color:white;
    font-size:16px;
    border-radius:5px;
    cursor:pointer;
    text-decoration: none;
}

button a:hover{
    background-color:#0056b3;
}

button:hover{
    background:#0056b3;
}
a :hover{
    
}
.createAcc{
    text-align: center;

}

</style>
</head>

<body>

<div class="login-container">
    <h2>Login</h2>

    <form>
        <div class="input-group">
            <label for="userid">User ID</label>
            <input type="text" id="userid" placeholder="Enter User ID" required>
            <small class="error" id="useridError"></small>
        </div>

        <div class="input-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter Password" required>
            <small class="error" id="passwordError"></small>
        </div>

        <button type="submit">           
            Login
        </button>
        
        <div class="createAcc"><br>
            <a href="#">Create Account</a>
        </div>
    </form>
    <div class="resultError">
        
    </div>
</div>


    <Script>
        let userid = document.querySelector("#userid");
        let password = document.querySelector("#password");
        let form = document.querySelector("form");
        let ip = document.querySelector("input");
        let btn = document.querySelector("button");
        let atag= document.querySelector("a");
        form.addEventListener("submit" , function(dets){
            dets.preventDefault()
            document.querySelector("#useridError").textContent = "";
            document.querySelector("#passwordError").textContent = "";
            const userIdRegex = /^[a-zA-Z0-9_]{5,15}$/;
            const passwordRegex =/^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$/;
            let useridans = userIdRegex.test(userid.value);
            let passwordans= passwordRegex.test(password.value);
           // btn.textContent = "login successful"          
            if(!useridans){
                document.querySelector("#useridError").textContent = "userId is wrong";
            }
            if(!passwordans){
                document.querySelector("#passwordError").textContent = "password is wrong";
            }
        });
    </Script>
</body>
</html>
