<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>
    <link rel="stylesheet" href="signup.css">
    <style>
    *{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
    }

    body{
        min-height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        background: rgb(32, 66, 85);;
    }

    .signup-box{
        width:400px;
        background:rgb(90, 129, 150);
        padding:30px;
        border-radius:12px;
        box-shadow:0 0 15px rgba(0,0,0,0.15);
    }

    .signup-box h2{
        text-align:center;
        margin-bottom:20px;
    }

    .input-box{
        margin-bottom:15px;
    }

    .input-box label{
        display:block;
        margin-bottom:6px;
        font-weight:600;
    }

    .input-box input{
        width:100%;
        padding:10px;
        border:1px solid #ccc;
        border-radius:6px;
        outline:none;
    }

    .input-box input:focus{
        border-color:#2563eb;
    }

    button{
        width:100%;
        padding:12px;
        border:none;
        border-radius:6px;
        background:#2563eb;
        color:white;
        cursor:pointer;
        font-size:16px;
    }

    button:hover{
        background:#1d4ed8;
    }

    p{
        text-align:center;
        margin-top:15px;
    }

    a{
        text-decoration:none;
        color:#2563eb;
    }
    </style>
</head>
<body>

    <section class="container">

        <div class="signup-box">
            <h2>Create Account</h2>

            <form>

                <div class="input-box">
                    <label>Full Name</label>
                    <input type="text" placeholder="Enter your name">
                </div>

                <div class="input-box">
                    <label>Email</label>
                    <input type="email" id="email" placeholder="Enter your email">
                </div>

                <div class="input-box">
                    <label>User ID</label>
                    <input type="text" id="userid" placeholder="Create User ID">
                </div>

                <div class="input-box">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="Create Password">
                </div>

                <div class="input-box">
                    <label>Confirm Password</label>
                    <input type="password" id="confirmPassword" placeholder="Confirm Password">
                </div>

                <button type="submit">Create Account</button>

                <p>
                    Already have an account?
                    <a href="login.html">Login</a>
                </p>

            </form>
        </div>

    </section>

</body>
</html>
