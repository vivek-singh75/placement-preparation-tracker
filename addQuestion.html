<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add question page</title>
    <link rel="stylesheet" href="addQuestion.css">
</head>
<body>
    <section id="mainSec">
        <div class="heading">
            <h3>Add Solved Question</h3>
        </div>
        <div class="box">
            <div class="field">
                <label for="question">Question Name</label>
                <input type="text" name="question" placeholder="Enter Question Name" required>
            </div>
            <div class="field">
                <label for="type">Types of questions:</label>

                <select id="type" name="type">
                    <option value="Array">Array</option>
                    <option value="String">String</option>
                    <option value="Recursion">Recursion</option>
                    <option value="tree">tree</option>
                </select>
            </div>
            <div class="field">
                <label for="level">dificulty level:</label>

                <select id="level" name="level">
                    <option value="Easy">Easy</option>
                    <option value="Medium">Medium</option>
                    <option value="Hard">Hard</option>
                </select>
            </div>
            <div class="field">
                <label for="Plateform">Plateform:</label>

                <select id="Plateform" name="Plateform">
                    <option value="leetcode">leetcode</option>
                    <option value="hackthon">hackthon</option>

                </select>
            </div>
            <div class="field">
                <label for="Status">Status:</label>

                <select id="Status" name="Status">
                    <option value="Solved">Solved</option>
                    <option value="inprogress">inprogress</option>
                    <option value="untouch">untouch</option>
                </select>
            </div>
            <div class="field" id="submit" >
                 <input type="submit">
            </div>
        </div>
    </section>
</body>
</html>
