<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add question page</title>
    <link rel="stylesheet" href="addQuestion.css">
</head>
<body>
    <section id="mainSec">
        <div class="heading">
            <h3>Add Solved Question</h3>
        </div>       
        <form action="" class="box">
            <div class="field" >
                <label for="question">Question Name</label>
                <input type="text" id="questionName" name="question" placeholder="Enter Question Name" required>
            </div>
            <div class="field" id="typeOf">
                <label for="type">Types of questions:</label>

                <select id="typeofQ" name="type">
                    <option value="" disabled selected >Select</option>
                    <option value="Array">Array</option>
                    <option value="String">String</option>
                    <option value="Recursion">Recursion</option>
                    <option value="Tree">Tree</option>
                    <option value="Graph">Graph</option>
                    <option value="HashMap">HashMap</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            <div class="field">
                <label for="level">dificulty level:</label>

                <select id="level" name="level">
                    <option value="" disabled selected >Select</option>
                    <option value="Easy">Easy</option>
                    <option value="Medium">Medium</option>
                    <option value="Hard">Hard</option>
                </select>
            </div>
            <div class="field">
                <label for="Plateform">Plateform:</label>

                <select id="Plateform" name="Plateform">
                    <option value="" disabled selected >Select</option>
                    <option value="self">Self Study</option>
                    <option value="leetcode">Leetcode</option>
                    <option value="hackthon">Hackthon</option>

                </select>
            </div>
            <div class="field">
                <label for="Status">Status:</label>

                <select id="Status" name="Status">
                    <!-- <option value="" disabled selected >Select</option> -->
                    <option value="Solved" >First Time</option>
                    <option value="inprogress">Second Time</option>
                    <option value="untouch">Third Time or More</option>
                </select>
            </div>
            <div class="field" id="submit" >
                 <input type="submit">
            </div>
        </form>
    </section>

    <script src="addQScript.js"></script>
</body>
</html>
